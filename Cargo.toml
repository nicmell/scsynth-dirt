[package]
name = "scsynth-dirt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["nicmell"]
description = "Dirt events on scsynth, the SuperCollider synthesis server: the synth definitions of SuperDirt, and the OSC packets that SuperDirt sends for each sound, with no I/O."
license = "GPL-3.0-or-later"
repository = "https://github.com/nicmell/scsynth-dirt"
readme = "README.md"
keywords = ["supercollider", "scsynth", "superdirt", "sampler", "audio"]
categories = ["multimedia::audio"]

[dependencies]
scsynth-osc = { git = "https://github.com/nicmell/scsynth-osc", tag = "v0.2.0", version = "0.2.0" }
scsynth-synthdef = { git = "https://github.com/nicmell/scsynth-synthdef", tag = "v0.15.0", version = "0.15.0" }
serde = { version = "1.0.140", features = ["derive"], optional = true }

[dev-dependencies]
serde = { version = "1.0.140", features = ["derive"] }
serde_json = { version = "1.0.60", features = ["float_roundtrip"] }

[features]
sc3-plugins = ["scsynth-synthdef/sc3-plugins"]
fs = []
serde = ["dep:serde", "scsynth-osc/serde"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
